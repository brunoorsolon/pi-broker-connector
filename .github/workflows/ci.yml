name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout exact reviewed broker integration fixture
        uses: actions/checkout@v6
        with:
          repository: matuto-ai/psst
          ref: 2a21c0c332cab0570e9a54aa0e7e0be41e1d9eba
          path: .ci/psst
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - name: Install pinned official Pi in isolated fixture
        run: npm install --prefix "$RUNNER_TEMP/pi-host" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
      - name: Verify native loader and installer
        run: npm run test:host
        env:
          PI_TEST_INSTALL: ${{ runner.temp }}/pi-host
      - name: Verify actual Pi PTY, admin approval, HTTPS and thirty waiting SDK sessions
        run: npm run test:approval
        env:
          PI_TEST_INSTALL: ${{ runner.temp }}/pi-host
          PSST_TEST_SOURCE: .ci/psst
      - name: Build disposable native Pi test container
        run: docker build -f test/containers/Containerfile -t psst-pi-approval-ci .
      - name: Verify real container recreation with only native agent storage retained
        run: npm run test:approval
        env:
          PI_TEST_INSTALL: ${{ runner.temp }}/pi-host
          PSST_TEST_SOURCE: .ci/psst
          PI_TEST_CONTAINER_IMAGE: psst-pi-approval-ci
      - run: npm pack --dry-run
